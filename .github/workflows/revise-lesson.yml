name: revise September 13 lesson
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-episode
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EPISODE_DATE: '2026-09-13'
      FEED_BASE: https://ayeprinz.github.io/the-forge
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Stage reviewed lesson and recorder
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,content in files.items():
              p=pathlib.Path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content)
          PYCODE
          python3 -m py_compile build.py reserve.py
          python3 -c "import build,pathlib; build.validate_script(pathlib.Path('scripts/2026-09-13.json'))"
          git config user.name forge-bot
          git config user.email forge-bot@users.noreply.github.com
          git add build.py reserve.py LEARNING-BRIEF.md
          git diff --staged --quiet || git commit -m "Track speech usage and improve lesson preparation"
          git push
      - name: Reserve authorised revision allowance
        run: python3 reserve.py
      - name: Record corrected lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -u build.py
      - name: Publish revised audio and notes
        run: |
          git add scripts/2026-09-13.json docs
          git diff --staged --quiet || git commit -m "Publish corrected September 13 lesson with worked example"
          git push
      - name: Preserve recording and usage for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-revision-${{ github.run_id }}
          path: |
            _tmp/
            docs/audio/*.pending.mp3
            docs/*-audio-check.json
          retention-days: 7
          if-no-files-found: ignore
