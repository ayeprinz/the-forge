name: Label Forge episode topics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-episode
  cancel-in-progress: false
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update titles without changing audio or episode identifiers
        run: |
          python3 - <<'PY'
          import json, pathlib, re, html
          topics = {'2026-09-08':'Critical Thinking','2026-09-09':'Evaluating Books & Beliefs','2026-09-10':'Critical Thinking','2026-09-11':'Critical Thinking','2026-09-13':'Critical Thinking'}
          titles = {}
          for date, topic in topics.items():
              path = pathlib.Path('scripts') / (date + '.json')
              data = json.loads(path.read_text())
              title = '[' + topic + '] ' + re.sub(r'^\[[^\]]+\]\s*', '', data['title'])
              data['title'] = title
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
              titles[date] = title
          path = pathlib.Path('docs/feed.xml')
          feed = path.read_text()
          def update(match):
              item = match.group(0)
              guid = re.search(r'<guid[^>]*>(.*?)</guid>', item).group(1)
              if guid in titles:
                  item = re.sub(r'<title>.*?</title>', lambda m: '<title>' + html.escape(titles[guid], quote=False) + '</title>', item, count=1, flags=re.S)
              return item
          path.write_text(re.sub(r'<item>.*?</item>', update, feed, flags=re.S))
          print(json.dumps(titles))
          PY
      - name: Publish labels
        run: |
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add scripts docs/feed.xml
          git diff --staged --quiet || git commit -m "Add clear subject labels to Forge episodes"
          git push
