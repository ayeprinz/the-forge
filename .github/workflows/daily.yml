name: daily episode

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      episode_date:
        description: 'Episode date (YYYY-MM-DD), blank for today'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render episode and rebuild feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEED_BASE: https://ayeprinz.github.io/the-forge
          EPISODE_DATE: ${{ github.event.inputs.episode_date }}
        run: python3 build.py

      - name: Preserve audio for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-render-${{ github.run_id }}
          path: |
            _tmp/
            docs/audio/*.pending.mp3
            docs/*-audio-check.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit
        run: |
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add -A docs
          git diff --staged --quiet || git commit -m "episode $(date -u +%F)"
          git push
