name: daily episode

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      episode_date:
        description: 'Episode date (YYYY-MM-DD), blank for today'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    outputs:
      episode_date: ${{ steps.date.outputs.value }}
    steps:
      - name: Fix episode date for the whole run
        id: date
        env:
          REQUESTED_DATE: ${{ github.event.inputs.episode_date }}
        run: |
          python3 - <<'PYDATE'
          import datetime,os
          from zoneinfo import ZoneInfo
          value=os.environ.get('REQUESTED_DATE') or datetime.datetime.now(ZoneInfo('Europe/London')).date().isoformat()
          assert datetime.date.fromisoformat(value).isoformat()==value
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('value='+value+'\n')
          PYDATE
      - uses: actions/checkout@v4

      - name: Check reviewed script before any spending
        env:
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: python3 preflight.py

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Reserve episode allowance
        env:
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: |
          git config user.name forge-bot
          git config user.email forge-bot@users.noreply.github.com
          python3 reserve.py

      - name: Render episode and rebuild feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEED_BASE: https://ayeprinz.github.io/the-forge
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: python3 -u build.py

      - name: Preserve audio for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-render-${{ github.run_id }}
          path: |
            _tmp/
            docs/audio/${{ steps.date.outputs.value }}*.mp3
            docs/*-audio-check.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Package complete episode before publication
        env:
          EPISODE_DATE: ${{ steps.date.outputs.value }}
        run: python3 package_delivery.py

      - name: Preserve complete delivery
        uses: actions/upload-artifact@v4
        with:
          name: forge-delivery-${{ github.run_id }}
          path: delivery/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forge-delivery-${{ github.run_id }}
          path: delivery
      - name: Install ffmpeg for feed duration checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Restore verified saved audio without speech access
        env:
          FEED_BASE: https://ayeprinz.github.io/the-forge
        run: python3 restore_delivery.py
      - name: Publish with bounded retries
        run: |
          git config user.name forge-bot
          git config user.email forge-bot@users.noreply.github.com
          git add -A docs
          git diff --staged --quiet || git commit -m "Publish verified Forge delivery"
          python3 publish.py
      - name: Verify public delivery and refresh Overcast
        env:
          EPISODE_DATE: ${{ needs.render.outputs.episode_date }}
        run: python3 -u verify_delivery.py
