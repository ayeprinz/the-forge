name: Publish saved October 7 audio
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-episode
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EPISODE_DATE: '2026-10-07'
      FEED_BASE: https://ayeprinz.github.io/the-forge
    steps:
      - uses: actions/checkout@v4
      - run: python3 preflight.py
      - uses: actions/download-artifact@v4
        with:
          name: forge-render-37640351288
          run-id: 37640351288
          github-token: ${{ github.token }}
          path: recovery
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assemble saved clips without speech access
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess,shutil
          import build
          root=pathlib.Path.cwd()
          script=root/'scripts/2026-10-07.json'
          ep=build.validate_script(script)
          fingerprint=hashlib.sha256((build.MODEL+script.read_text()).encode()).hexdigest()[:20]
          tmp=root/'recovery/_tmp'/fingerprint
          report=json.loads((root/'recovery/docs/2026-10-07-audio-check.json').read_text())
          usage=json.loads((tmp/'usage.json').read_text())
          assert report['date']=='2026-10-07' and report['usage']==usage
          assert usage['calls']==80 and not usage['uncertain'] and usage['usd']<=2
          assert report['voice_difference_lu']<=3 and 0<report['duration_seconds']<=4200
          assert len(ep['turns'])==80
          for i in range(80):
              assert (tmp/f'{i:04d}.mp3').stat().st_size>0
              assert (tmp/f'{i:04d}_norm.wav').stat().st_size>0
          out=root/'docs/audio/2026-10-07.mp3'
          assert not out.exists(), 'Audio already published; do not overwrite'
          out.parent.mkdir(parents=True,exist_ok=True)
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','list.txt','-af','loudnorm=I=-16:TP=-1.5:LRA=11','-ar','24000','-c:a','libmp3lame','-b:a','48k','-ac','1',str(out)],cwd=tmp,check=True,capture_output=True)
          if 'tempo_adjustment' in report:
              adjusted=out.with_suffix('.adjusted.mp3')
              subprocess.run(['ffmpeg','-y','-i',str(out),'-af',f"atempo={report['tempo_adjustment']},loudnorm=I=-16:TP=-1.5:LRA=11",'-ar','24000','-c:a','libmp3lame','-b:a','48k','-ac','1',str(adjusted)],check=True,capture_output=True)
              adjusted.replace(out)
          assert abs(build.seconds(out)-report['duration_seconds'])<0.1
          shutil.copy2(root/'recovery/docs/2026-10-07-audio-check.json',root/'docs/2026-10-07-audio-check.json')
          build.build_feed()
          PY
      - name: Preserve complete episode
        uses: actions/upload-artifact@v4
        with:
          name: forge-published-oct7
          path: |
            docs/audio/2026-10-07.mp3
            docs/2026-10-07-audio-check.json
            docs/feed.xml
          retention-days: 7
      - name: Publish
        run: |
          git config user.name forge-bot
          git config user.email forge-bot@users.noreply.github.com
          git add -A docs
          git commit -m "Publish saved October 7 audio after GitHub push error"
          git push || { sleep 10; git push; }
      - name: Verify public delivery and refresh Overcast
        run: python3 -u verify_delivery.py
